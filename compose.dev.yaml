# Local development services started by ./run.sh. Never deploy this file.
# Every port binds to 127.0.0.1 so nothing is reachable from other machines.
name: cyenetic-dev

services:
  mailpit:
    # Catches every email (sign-in codes, invites, password resets). Inbox: http://localhost:8025
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  minio:
    # S3-compatible object storage for media uploads. Console: http://localhost:9001
    # The official minio/minio image is no longer published on Docker Hub; pgsty/minio is a community build of the same server.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cyenetic}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${DASHBOARD_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # PostgreSQL and Redis are only needed by the real cyenetic-backend (API_MODE=backend).
  postgres:
    profiles: ["backend"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyenetic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cyenetic}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyenetic}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    profiles: ["backend"]
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

volumes:
  minio-data:
  postgres-data:
