name: Dashboard CI

on:
  push:
    branches: [test, development]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      production_build:
        description: Build the tested release.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: npm run check:architecture
      - run: node --test scripts/deployment.test.mjs
  tests:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  security:
    name: Production dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
  container:
    name: Container smoke test
    needs: [architecture, tests, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          COMPOSE_PROJECT_NAME: cyenetic-dashboard
        run: docker compose config --quiet
      - name: Build and exercise production container
        run: bash scripts/check-container.sh
  build:
    name: Production build
    needs: [architecture, tests, security, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
